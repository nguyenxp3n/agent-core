name: Verify Skill Framework and Installers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate bash installer syntax
        run: |
          bash -n install.sh

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify skill file tree integrity
        run: |
          test -f skills/agent-core/SKILL.md
          test -f skills/agent-core/references/principles.md
          test -f skills/agent-core/references/execution.md
          test -f skills/agent-core/references/verification.md
          test -f mcp/server.js
          test -f mcp/package.json
          test -f mcp/test.js
          test -f integrations/chatgpt/openapi.yaml
          test -f integrations/chatgpt/instructions.md
          test -f .claude-plugin/marketplace.json
          test -f .claude-plugin/plugin.json
          test -f .mcp.json

      - name: Validate JSON manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json')); json.load(open('.claude-plugin/plugin.json')); json.load(open('.mcp.json'))"

      - name: Validate MCP server syntax
        run: |
          node -c mcp/server.js

      - name: Run MCP integration test suite
        run: |
          node mcp/test.js

      - name: Validate OpenAPI YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('integrations/chatgpt/openapi.yaml'))"

      - name: Test bash installer in workspace mode
        run: |
          bash install.sh 5
